name: gander

services:
  service:
    env_var: GANDER_PORT
    env_file:
      - .env
      - .pc_env
  mcp_inspector_client:
    env_var: MCP_INSPECTOR_CLIENT_PORT
  mcp_inspector_sandbox:
    env_var: MCP_INSPECTOR_SANDBOX_PORT

computed:
  # The app's serviceUrl and the readiness probe both read this. Built from the
  # port rather than ${service.url:direct}, which resolves empty for a service
  # with no .test hostname — and this service wants none, it is loopback only.
  GANDER_SERVICE_URL:
    value: "http://127.0.0.1:${service.port}"
    env_file:
      - .env
      - .pc_env

  # process-compose reads .pc_env before anything else. Setting this both enables
  # UDS mode and gives each worktree its own control socket, so `bin/dev status`
  # in one checkout never talks to another checkout's stack.
  PC_SOCKET_PATH:
    value: "/tmp/process-compose-${project_name}${instance:+-${instance}}.sock"
    env_file: .pc_env

  # Where the running app listens for `bin/gander`. Kept in /tmp, not the checkout,
  # for the same reason as the control socket above: a Unix socket path is capped
  # near 104 characters, and a worktree path can run long.
  GANDER_APP_SOCKET:
    value: "/tmp/gander-app-${project_name}${instance:+-${instance}}.sock"
    env_file:
      - .env
      - .pc_env
